# dsh-news bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:<this-directory>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (news fetch routes, image proxy, system-prompt
# announcement), and the `dsh.client` declaration in package.json makes the
# browser half (exports "./client", served at /plugins/news/client.js) load
# in the web GUI.
- insert:
    - id: news
      name: '@wilond/dsh-news'
